<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
    <style>
        /* Character stretching up to look taller */
        @keyframes standTall {
        0%, 100% { transform: translateY(0px) scaleY(1); }
        45%, 65% { transform: translateY(-10px) scaleY(1.03); }
        }

        /* Lively head tilt and nod */
        @keyframes headBob {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        25% { transform: rotate(-4deg) translateY(-2px); }
        55% { transform: rotate(5deg) translateY(-10px); }
        80% { transform: rotate(-2deg) translateY(-2px); }
        }

        /* Cartoon belly sucking in and relaxing */
        @keyframes bellyBreathe {
        0%, 100% { transform: scaleX(1.06) scaleY(0.98); }
        45%, 65% { transform: scaleX(0.84) scaleY(1.04); }
        }

        /* Sliding caliper bar dropping onto his head */
        @keyframes measureDrop {
        0%, 100% { transform: translateY(0px); }
        45%, 65% { transform: translateY(42px); }
        }

        /* Subtle eye blink */
        @keyframes blink {
        0%, 44%, 48%, 100% { transform: scaleY(1); }
        46% { transform: scaleY(0.1); }
        }

        .body-group {
        transform-origin: 195px 345px;
        animation: standTall 3.4s ease-in-out infinite;
        }

        .head-group {
        transform-origin: 195px 132px;
        animation: headBob 3.4s ease-in-out infinite;
        }

        .belly-shape {
        transform-origin: 185px 215px;
        animation: bellyBreathe 3.4s ease-in-out infinite;
        }

        .caliper-arm {
        animation: measureDrop 3.4s ease-in-out infinite;
        }

        .eyes {
        transform-origin: 190px 92px;
        animation: blink 3.4s infinite;
        }
    </style>

    <!-- Floor Shadow (Grounded, No Background) -->
    <ellipse cx="165" cy="352" rx="95" ry="10" fill="#cbd5e1" opacity="0.55" />

    <!-- STADIOMETER (HEIGHT SCALE) -->
    <g id="stadiometer">
        <!-- Base Plate -->
        <rect x="42" y="340" width="90" height="12" rx="6" fill="#475569" />
        <!-- Vertical Pole -->
        <rect x="78" y="28" width="18" height="314" rx="5" fill="#94a3b8" stroke="#334155" stroke-width="3" />
        <!-- Ruler Tick Marks -->
        <line x1="88" y1="55" x2="96" y2="55" stroke="#334155" stroke-width="2.5" />
        <line x1="85" y1="80" x2="96" y2="80" stroke="#334155" stroke-width="2.5" />
        <line x1="88" y1="105" x2="96" y2="105" stroke="#334155" stroke-width="2.5" />
        <line x1="85" y1="130" x2="96" y2="130" stroke="#334155" stroke-width="2.5" />
        <line x1="88" y1="155" x2="96" y2="155" stroke="#334155" stroke-width="2.5" />
        <line x1="85" y1="180" x2="96" y2="180" stroke="#334155" stroke-width="2.5" />
        <line x1="88" y1="205" x2="96" y2="205" stroke="#334155" stroke-width="2.5" />
        <line x1="85" y1="230" x2="96" y2="230" stroke="#334155" stroke-width="2.5" />

        <!-- Animated Sliding Measuring Bar -->
        <g class="caliper-arm">
            <rect x="72" y="34" width="30" height="16" rx="4" fill="#f59e0b" stroke="#334155" stroke-width="3" />
            <path d="M 102 38 L 212 38 C 216 38 218 41 218 44 C 218 47 216 49 212 49 L 102 49 Z" fill="#fbbf24" stroke="#334155" stroke-width="3" />
            <circle cx="87" cy="42" r="3" fill="#334155" />
        </g>
    </g>

    <!-- CARTOON CHARACTER -->
    <g class="body-group">
        <!-- Left Arm (Behind) -->
        <path d="M 155 150 C 132 175 132 215 148 232" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round" />
        <path d="M 155 150 C 132 175 132 215 148 232" fill="none" stroke="#ffedd5" stroke-width="8" stroke-linecap="round" />

        <!-- Legs & Shorts -->
        <rect x="164" y="255" width="24" height="78" rx="10" fill="#1e293b" stroke="#334155" stroke-width="3" />
        <rect x="200" y="255" width="24" height="78" rx="10" fill="#1e293b" stroke="#334155" stroke-width="3" />

        <!-- Cartoon Sneakers -->
        <path d="M 152 342 C 152 328 170 326 188 326 L 190 342 Z" fill="#ef4444" stroke="#334155" stroke-width="3" stroke-linejoin="round" />
        <line x1="152" y1="342" x2="190" y2="342" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
        <path d="M 196 342 C 196 328 214 326 232 326 L 234 342 Z" fill="#ef4444" stroke="#334155" stroke-width="3" stroke-linejoin="round" />
        <line x1="196" y1="342" x2="234" y2="342" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

        <!-- Animated Chubby Torso / Hoodie -->
        <g class="belly-shape">
            <path d="M 152 142 C 132 185 124 245 156 268 C 180 282 224 280 242 260 C 258 240 248 180 232 142 Z" fill="#38bdf8" stroke="#334155" stroke-width="3.5" />
            <!-- Hoodie Pocket & Drawstrings -->
            <path d="M 164 232 Q 194 242 222 232 L 216 262 Q 192 268 170 262 Z" fill="#0284c7" stroke="#334155" stroke-width="2.5" />
            <line x1="184" y1="146" x2="182" y2="178" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
            <line x1="204" y1="146" x2="206" y2="178" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        </g>

        <!-- Right Arm (Hand on hip) -->
        <path d="M 232 150 C 264 170 266 205 236 222" fill="none" stroke="#334155" stroke-width="15" stroke-linecap="round" />
        <path d="M 232 150 C 264 170 266 205 236 222" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />
        <circle cx="234" cy="222" r="8" fill="#ffedd5" stroke="#334155" stroke-width="3" />
    </g>

    <!-- CARTOON HEAD (Independent Bobbing Motion) -->
    <g class="head-group">
        <!-- Neck -->
        <rect x="182" y="122" width="26" height="20" rx="8" fill="#fed7aa" stroke="#334155" stroke-width="3" />

        <!-- Head & Chubby Cheeks -->
        <path d="M 162 96 C 162 68 228 68 228 96 C 234 114 224 134 195 134 C 166 134 156 114 162 96 Z" fill="#ffedd5" stroke="#334155" stroke-width="3.5" />

        <!-- Spiky Cartoon Hair -->
        <path d="M 160 94 C 154 74 170 60 184 66 C 192 54 210 56 214 68 C 228 66 236 80 228 96 C 222 82 206 78 195 80 C 182 78 168 82 160 94 Z" fill="#7c2d12" stroke="#334155" stroke-width="3.5" stroke-linejoin="round" />

        <!-- Ear -->
        <circle cx="228" cy="104" r="7" fill="#ffedd5" stroke="#334155" stroke-width="3" />

        <!-- Rosy Cheeks -->
        <ellipse cx="170" cy="108" rx="6" ry="3.5" fill="#fca5a5" opacity="0.8" />
        <ellipse cx="212" cy="108" rx="6" ry="3.5" fill="#fca5a5" opacity="0.8" />

        <!-- Expressive Cartoon Eyes -->
        <g class="eyes">
            <circle cx="180" cy="94" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="2.5" />
            <circle cx="178.5" cy="94" r="2.5" fill="#1e293b" />
            <circle cx="202" cy="94" r="5.5" fill="#ffffff" stroke="#334155" stroke-width="2.5" />
            <circle cx="200.5" cy="94" r="2.5" fill="#1e293b" />
        </g>

        <!-- Raised Eyebrows -->
        <path d="M 173 84 Q 180 80 186 84" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 196 84 Q 202 80 209 84" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

        <!-- Cartoon Nose -->
        <path d="M 189 96 C 183 102 185 108 192 107" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

        <!-- Big Goofy Grin -->
        <path d="M 179 115 Q 191 126 204 115 Z" fill="#ffffff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" />
    </g>
</svg>